<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Insurance Cost Prediction</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 400px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            padding: 12px;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .result {
            margin-top: 25px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

    </style>
</head>

<body>

<div class="container">

    <h2>Insurance Cost Prediction</h2>

    <form method="POST" action="/">

        <label>
            Age
            <input type="number" name="age" required>
        </label>

        <label>
            Sex
            <select name="sex" required>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
        </label>

        <label>
            BMI
            <input type="number" step="0.01" name="bmi" required>
        </label>

        <label>
            Children
            <input type="number" name="children" required>
        </label>

        <label>
            Smoker
            <select name="smoker" required>
                <option value="yes">Yes</option>
                <option value="no">No</option>
            </select>
        </label>

        <label>
            Region
            <select name="region" required>
                <option value="northeast">Northeast</option>
                <option value="northwest">Northwest</option>
                <option value="southeast">Southeast</option>
                <option value="southwest">Southwest</option>
            </select>
        </label>

        <button type="submit">
            Predict
        </button>

    </form>

    {% if prediction is not none %}

    <div class="result">
        Predicted Insurance Cost: {{ prediction }}
    </div>

    {% endif %}

</div>

</body>

</html>
